name: cse406-hijack
x-common: &common
  image: cse406-hijack:local
  build: .
  init: true
  read_only: true
  tmpfs:
    - /tmp
  volumes:
    - ${EVIDENCE_ROOT:-./evidence}:/evidence
  environment:
    SCENARIO: ${SCENARIO:-attack}
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  mem_limit: 128m
  cpus: 0.5
  pids_limit: 64
services:
  attacker:
    <<: *common
    command: [python, -m, lab.attacker]
    cap_add: [NET_RAW]
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv4.conf.all.rp_filter: 0
      net.ipv4.conf.default.rp_filter: 0
      net.ipv4.conf.all.send_redirects: 0
      net.ipv4.conf.default.send_redirects: 0
    networks:
      client_side:
        ipv4_address: 10.77.1.20
      server_side:
        ipv4_address: 10.77.2.20
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; exit(0 if Path('/tmp/attacker-ready').exists() else 1)"]
      interval: 1s
      timeout: 2s
      retries: 15
  server:
    <<: *common
    command: [python, -m, lab.server]
    cap_add: [NET_ADMIN]
    networks:
      server_side:
        ipv4_address: 10.77.2.30
    depends_on:
      attacker:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from pathlib import Path; exit(0 if Path('/tmp/server-ready').exists() else 1)"]
      interval: 1s
      timeout: 2s
      retries: 15
  client:
    <<: *common
    command: [python, -m, lab.client]
    cap_add: [NET_ADMIN]
    networks:
      client_side:
        ipv4_address: 10.77.1.10
    depends_on:
      server:
        condition: service_healthy
networks:
  client_side:
    internal: true
    ipam:
      config:
        - subnet: 10.77.1.0/24
  server_side:
    internal: true
    ipam:
      config:
        - subnet: 10.77.2.0/24
